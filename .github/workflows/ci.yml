name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        nthreads:
          - 1
          - 2
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.nthreads }}
        timeout-minutes: 20
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
  trim:
    name: juliac --trim=safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Set up the trim test environment
        run: julia --project=test/trim -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Compile a meter with safe trimming
        run: julia --project=test/trim -e 'using JuliaC; JuliaC.main(ARGS)' -- --output-exe pmtrim --project=test/trim --experimental --trim=safe test/trim/meter.jl
      - name: Run the trimmed binary without runtime code generation
        env:
          JULIA_LOAD_CODEGEN_LIB: '0'
        run: |
          set -o pipefail
          ./pmtrim 2>&1 | tee pmtrim.log
          grep -q '100%' pmtrim.log
