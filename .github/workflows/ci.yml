name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      actions: write    # lets julia-actions/cache delete the caches it created
      contents: read
      id-token: write   # authenticates the Codecov upload (see below)
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        nthreads:
          - 1
          - 2
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Create Conda's root environment directory
        # IJulia, a test dependency, depends on Conda, which fails to precompile when
        # this directory is missing.  Conda's build creates it, but julia-actions/cache
        # restores the built package without it and Pkg only builds newly installed
        # packages (JuliaPy/Conda.jl#104), so nightly fails as soon as it re-precompiles.
        run: julia -e 'mkpath(joinpath(first(DEPOT_PATH), "conda", "3", string(Sys.ARCH)))'
        shell: bash
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.nthreads }}
        timeout-minutes: 20
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          # master is a protected branch, so Codecov rejects tokenless uploads to it.
          # authenticate with the job's OIDC token whenever the workflow runs in this
          # repository, and then also fail the job if the upload fails; pull requests
          # from forks have no OIDC token and keep the tokenless path
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: lcov.info
  trim:
    name: juliac --trim=safe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Set up the trim test environment
        run: julia --project=test/trim -e 'using Pkg; Pkg.instantiate()'
      - name: Compile a meter with safe trimming
        run: julia --project=test/trim -e 'using JuliaC; JuliaC.main(ARGS)' -- --output-exe pmtrim --project=test/trim --experimental --trim=safe test/trim/meter.jl
      - name: Run the trimmed binary without runtime code generation
        env:
          JULIA_LOAD_CODEGEN_LIB: '0'
        run: |
          set -o pipefail
          ./pmtrim 2>&1 | tee pmtrim.log
          grep -q '100%' pmtrim.log
